services:
  influxdb:
    image: influxdb:2
    container_name: influxdb_s2
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin_tilapia
      - DOCKER_INFLUXDB_INIT_PASSWORD=password_s2_tilapia
      - DOCKER_INFLUXDB_INIT_ORG=S2_Project
      - DOCKER_INFLUXDB_INIT_BUCKET=tilapia_monitoring
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    container_name: tilapia_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tilapia
      POSTGRES_PASSWORD: tilapia_s2_secure
      POSTGRES_DB: tilapia_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilapia -d tilapia_analytics"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_s2
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      influxdb:
        condition: service_healthy
    restart: always

  backend:
    build: ./backend
    container_name: tilapia_backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      INFLUX_URL: http://influxdb:8086
      DATABASE_URL: postgresql://tilapia:tilapia_s2_secure@postgres:5432/tilapia_analytics
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081
    depends_on:
      influxdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: tilapia_frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: always

volumes:
  influxdb_data:
  grafana_data:
  postgres_data:
